<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="カウンター">
    <title>高機能ジャグラーカウンター</title>

    <!-- グラフ描画用ライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root { 
            --bg-color: #f2f2f7; --card-bg: #ffffff; --text-main: #333333; --text-sub: #666666;
            --mode-color: #007aff; --border-color: #cccccc; --box-shadow: rgba(0,0,0,0.05);
            --counter-name-bg: #f0f0f0; --prob-bg: #e5e5ea;
        }
        body.dark-mode {
            --bg-color: #000000; --card-bg: #1c1c1e; --text-main: #ffffff; --text-sub: #aaaaaa;
            --mode-color: #0a84ff; --border-color: #38383a; --box-shadow: rgba(255,255,255,0.02);
            --counter-name-bg: #2c2c2e; --prob-bg: #3a3a3c;
        }
        body.sub-mode { --mode-color: #ff3b30; }
        body.sub-mode:not(.dark-mode) { --bg-color: #ffebee; }
        body.sub-mode.dark-mode { --bg-color: #3a0b0b; }

        body { font-family: -apple-system, sans-serif; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); background-color: var(--bg-color); color: var(--text-main); user-select: none; margin: 0; transition: background-color 0.2s; }
        
        @keyframes flashPlus { 0% { background-color: #c8e6c9; } 100% { background-color: var(--bg-color); } }
        @keyframes flashMinus { 0% { background-color: #ffcdd2; } 100% { background-color: var(--bg-color); } }
        .flash-plus { animation: flashPlus 0.2s ease-out; }
        .flash-minus { animation: flashMinus 0.2s ease-out; }
        
        .tab-container { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; background-color: var(--card-bg); color: var(--text-sub); transition: 0.2s; -webkit-tap-highlight-color: transparent; box-shadow: 0 2px 5px var(--box-shadow); }
        .tab-btn.active { background-color: var(--mode-color); color: white; }

        .card { background: var(--card-bg); padding: 12px; border-radius: 10px; margin-bottom: 12px; box-shadow: 0 2px 5px var(--box-shadow); }
        input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        select, input[type="number"], input[type="text"] { font-size: 16px; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; width: 100%; box-sizing: border-box; background-color: var(--card-bg); color: var(--text-main); }
        
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 4px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .total-games-control { display: flex; gap: 8px; align-items: center; }
        .total-games-control input { flex: 1; text-align: center; font-size: 22px; font-weight: bold; color: var(--mode-color); padding: 10px; }
        .btn-tap { background-color: var(--mode-color); color: white; border: none; border-radius: 6px; padding: 12px; font-size: 18px; font-weight: bold; -webkit-tap-highlight-color: transparent; transition: transform 0.1s; min-width: 60px; }
        .btn-tap:active { transform: scale(0.92); opacity: 0.8; }

        .controls-flex { display: flex; gap: 10px; margin-bottom: 15px; }
        .controls-flex button { flex: 1; padding: 12px 5px; font-size: 14px; font-weight: bold; color: white; border: none; border-radius: 8px; -webkit-tap-highlight-color: transparent; }
        .mode-toggle { background-color: var(--mode-color); }
        .lock-toggle { background-color: #8e8e93; }
        .lock-toggle.unlocked { background-color: #ff9500; }
        
        .grid-counters { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .counter-box { background: var(--card-bg); border-radius: 10px; padding: 10px; text-align: center; box-shadow: 0 2px 5px var(--box-shadow); border: 2px solid transparent; transition: transform 0.1s; -webkit-tap-highlight-color: transparent; }
        .counter-box:active { transform: scale(0.92); opacity: 0.8; }
        body.sub-mode .counter-box { border-color: #ff3b30; }

        .counter-name { font-size: 14px; font-weight: bold; color: var(--text-main); padding: 5px; background: var(--counter-name-bg); border-radius: 4px; margin-bottom: 2px; }
        .counter-name.editable { background: #ffe0b2; color: #e65100; border: 1px dashed #ff9800; }
        .counter-value { font-size: 36px; font-weight: bold; color: var(--mode-color); margin: 2px 0; }
        .counter-prob { font-size: 14px; font-weight: bold; color: var(--text-sub); background: var(--prob-bg); border-radius: 4px; padding: 4px; margin-top: 5px; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .btn-sub-action { padding: 10px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-main); border-radius: 8px; font-size: 13px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
        .btn-solid { width: 100%; padding: 12px; background: #34c759; color: white; font-weight: bold; font-size: 15px; border: none; border-radius: 8px; -webkit-tap-highlight-color: transparent; margin-bottom: 10px; }
        .reset-btn { width: 100%; padding: 15px; background: #ff3b30; color: white; font-weight: bold; font-size: 16px; border: none; border-radius: 8px; -webkit-tap-highlight-color: transparent; margin-bottom: 30px; }
        
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; padding-top: 5px; }
        .theme-switch { background: #333; color: white; border: none; border-radius: 20px; padding: 5px 12px; font-size: 12px; font-weight: bold; }
        body.dark-mode .theme-switch { background: #f2f2f7; color: black; }

        /* 視覚的設定推測ゲージのスタイル */
        .estimation-box { background: rgba(0, 122, 255, 0.05); border: 1px solid rgba(0, 122, 255, 0.2); padding: 12px 10px 5px 10px; border-radius: 8px; margin-top: 15px; }
        .estimation-title { font-weight: bold; color: var(--mode-color); margin-bottom: 15px; font-size: 14px; text-align: center; }

        /* モーダル用スタイル（横スクロール対応） */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; justify-content: center; align-items: center; }
        .modal-overlay.active { display: flex; }
        .modal-content { background: var(--card-bg); color: var(--text-main); width: 95%; max-width: 600px; max-height: 85vh; border-radius: 12px; padding: 15px; box-sizing: border-box; overflow-y: auto; position: relative; }
        .modal-close { position: absolute; top: 10px; right: 10px; background: #8e8e93; color: white; border: none; border-radius: 50%; width: 28px; height: 28px; font-weight: bold; }
        
        .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
        .spec-table { width: 100%; min-width: 500px; border-collapse: collapse; font-size: 11px; text-align: center; }
        .spec-table th, .spec-table td { border: 1px solid var(--border-color); padding: 8px 4px; white-space: nowrap; }
        .spec-table th { background: var(--counter-name-bg); }

        @media screen and (orientation: landscape) {
            .grid-counters { grid-template-columns: repeat(3, 1fr); }
            .grid-2 { grid-template-columns: repeat(2, 1fr); }
            .counter-value { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="header-top">
        <h2 style="margin: 0; font-size: 18px;">カウンター</h2>
        <button class="theme-switch" onclick="toggleTheme()">🌙 ダークモード</button>
    </div>

    <div class="tab-container">
        <button class="tab-btn active" data-tab="A" onclick="switchTab('A')">台 A</button>
        <button class="tab-btn" data-tab="B" onclick="switchTab('B')">台 B</button>
        <button class="tab-btn" data-tab="C" onclick="switchTab('C')">台 C</button>
    </div>

    <div class="card">
        <div class="grid-2">
            <div class="input-group">
                <label>機種選択</label>
                <select id="series-select" onchange="renderCounters()">
                    <option value="マイジャグラーV">マイジャグラーV</option>
                    <option value="アイムジャグラーEX">アイムジャグラーEX</option>
                    <option value="ゴーゴージャグラー3">ゴーゴージャグラー3</option>
                    <option value="ファンキージャグラー2">ファンキージャグラー2</option>
                    <option value="ハッピージャグラーV III">ハッピージャグラーV III</option>
                    <option value="ジャグラーガールズSS">ジャグラーガールズSS</option>
                    <option value="ミスタージャグラー">ミスタージャグラー</option>
                </select>
            </div>
            <div class="input-group">
                <label>台番号メモ</label>
                <input type="text" id="machine-no" placeholder="例: 777" oninput="renderCounters()">
            </div>
        </div>
        
        <div class="grid-2">
            <div class="input-group">
                <label>スタート回数</label>
                <input type="number" id="start-games" value="0" oninput="renderCounters()" style="text-align: center; font-size: 20px;">
            </div>
            <div class="input-group">
                <label>有効ゲーム数（自動計算）</label>
                <div id="effective-games-display" style="font-size: 22px; font-weight: bold; text-align: center; padding: 6px; color: var(--text-sub);">0 G</div>
            </div>
        </div>

        <div class="input-group" style="margin-top: 5px; border-top: 1px solid var(--border-color); padding-top: 12px;">
            <label style="color: var(--mode-color); font-weight: bold; font-size: 14px;">現在の総回転</label>
            <div class="total-games-control">
                <input type="number" id="total-games" value="0" oninput="renderCounters()">
                <button class="btn-tap" id="btn-total-1" onclick="tapTotalGames(1)">+1</button>
                <button class="btn-tap" id="btn-total-10" onclick="tapTotalGames(10)">+10</button>
            </div>
        </div>

        <!-- 視覚的設定推測ゲージエリア -->
        <div class="estimation-box" id="estimation-box">
            <div class="estimation-title">🎯 リアルタイム設定推測ゲージ</div>
            <div id="estimation-result">
                <div style="text-align:center; color:var(--text-sub); font-size:12px; margin-bottom:10px;">
                    100G以上実戦すると、ここに現在地を示すゲージが表示されます。
                </div>
            </div>
        </div>
    </div>

    <div class="controls-flex">
        <button class="mode-toggle" id="mode-btn" onclick="toggleMode()">【＋】加算モード</button>
        <button class="lock-toggle" id="lock-btn" onclick="toggleLock()">名称変更: ロック中 🔒</button>
    </div>

    <div class="grid-counters" id="counters-container"></div>
    
    <div class="action-btns">
        <button class="btn-sub-action" onclick="openSpecModal()">📖 機種スペック表</button>
        <button class="btn-sub-action" onclick="openGraphModal()">📈 確率推移グラフ</button>
    </div>

    <button class="btn-sub-action" style="width:100%; margin-bottom:10px;" onclick="addCustomCounter()">＋ 新しい項目を追加</button>
    <button class="btn-solid" onclick="copyData()">📋 現在の台データをコピー</button>
    <button class="reset-btn" onclick="resetAll()">現在の台データをリセット</button>

    <!-- モーダル: 機種スペック表（単独ボーナス追加版） -->
    <div class="modal-overlay" id="spec-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('spec-modal')">✕</button>
            <h3 id="spec-modal-title" style="margin-top:0;">機種スペック</h3>
            <div id="spec-modal-body"></div>
        </div>
    </div>

    <!-- モーダル: 確率推移グラフ（100G以降限定版） -->
    <div class="modal-overlay" id="graph-modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal('graph-modal')">✕</button>
            <h3 style="margin-top:0;">📈 確率推移グラフ</h3>
            <div style="position: relative; height:300px; width:100%;">
                <canvas id="probChart"></canvas>
            </div>
            <p style="font-size:11px; color:gray; margin-top:10px; text-align:center;">※ばらつきを抑えるため、100G以降のデータのみ表示します。</p>
        </div>
    </div>
    <script>
        // 単独ボーナスを含む詳細なスペックデータ
        const JUGGLER_SPECS = {

                bb: [259.0, 258.0, 256.0, 251.0, 240.0, 234.9],
                solo_rb: [496.5, 455.1, 409.6, 344.9, 312.1, 292.6],
                rb: [354.2, 332.7, 306.2, 268.6, 247.3, 234.9],

            },
            'ファンキージャグラー2': {

                solo_rb: [595.8, 546.1, 474.9, 409.6, 372.4, 318.1],
                rb: [439.8, 407.1, 366.2, 322.8, 299.3, 262.1],
                total: [165.9, 158.3, 150.7, 140.2, 133.7, 118.7]
            },
            'ハッピージャグラーV III': {
                grape: [6.08, 6.05, 6.00, 5.95, 5.88, 5.80],
                solo_bb: [409.6, 402.0, 381.0, 364.1, 334.4, 312.1],
                bb: [273.1, 270.8, 263.2, 254.0, 239.2, 226.0],
                solo_rb: [546.1, 489.1, 442.8, 390.1, 344.9, 315.1],
                rb: [397.2, 362.1, 332.7, 300.6, 273.1, 256.0],
                total: [161.8, 154.9, 146.9, 137.7, 127.5, 120.0]
            },
            'ジャグラーガールズSS': {
                grape: [6.02, 5.98, 5.94, 5.89, 5.83, 5.75],
                solo_bb: [409.6, 399.6, 381.0, 364.1, 344.9, 318.1],
                bb: [273.1, 268.6, 260.1, 251.1, 240.9, 226.0],
                solo_rb: [528.5, 474.9, 420.1, 356.2, 315.1, 282.5],
                rb: [381.0, 352.3, 321.1, 282.5, 257.0, 234.9],
                total: [159.1, 152.4, 143.7, 132.7, 124.1, 115.4]
            },
            'ミスタージャグラー': {
                grape: [5.95, 5.90, 5.85, 5.80, 5.73, 5.62],
                solo_bb: [399.6, 390.1, 372.4, 356.2, 337.8, 312.1],
                bb: [268.6, 264.3, 256.0, 248.2, 239.2, 224.4],
                solo_rb: [512.0, 461.5, 402.0, 352.3, 318.1, 287.4],
                rb: [374.5, 344.9, 309.1, 277.8, 257.0, 238.3],
                total: [156.4, 149.3, 140.0, 130.8, 123.7, 115.5]
            }
        };

        let isSubMode = false;
        let isNameEditLocked = true;
        let currentTab = 'A';
        let chartInstance = null;
        
        function createDefaultData() {
            return {
                counters: [
                    { id: 1, name: 'ぶどう', count: 0 },
                    { id: 2, name: 'チェリー', count: 0 },
                    { id: 3, name: '単独BIG', count: 0 },
                    { id: 4, name: 'チェリーBIG', count: 0 },
                    { id: 5, name: '単独REG', count: 0 },
                    { id: 6, name: 'チェリーREG', count: 0 }
                ],
                startGames: 0,
                totalGames: 0,
                machineNo: '',
                series: 'マイジャグラーV',
                history: []
            };
        }

        let appData = {
            'A': createDefaultData(),
            'B': createDefaultData(),
            'C': createDefaultData()
        };
        let counters = appData[currentTab].counters;

        function syncCurrentDataToApp() {
            appData[currentTab].startGames = document.getElementById('start-games').value;
            appData[currentTab].totalGames = document.getElementById('total-games').value;
            appData[currentTab].machineNo = document.getElementById('machine-no').value;
            appData[currentTab].series = document.getElementById('series-select').value;
            appData[currentTab].counters = counters;
        }

        function saveData() {
            syncCurrentDataToApp();
            const saveData = {
                appData: appData,
                currentTab: currentTab,
                isDark: document.body.classList.contains('dark-mode')
            };
            localStorage.setItem('jugglerMultiData_v3', JSON.stringify(saveData));
        }

        function loadData() {
            const saved = localStorage.getItem('jugglerMultiData_v3');
            if (saved) {
                const data = JSON.parse(saved);
                if (data.appData) appData = data.appData;
                if (data.isDark) {
                    document.body.classList.add('dark-mode');
                    document.querySelector('.theme-switch').innerText = '☀️ ライトモード';
                }
                switchTab(data.currentTab || 'A', true);
            } else {
                switchTab('A', true);
            }
        }

        function switchTab(tab, isInitializing = false) {
            if (!isInitializing) syncCurrentDataToApp(); 
            currentTab = tab;
            
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tab);
            });

            const data = appData[tab];
            counters = data.counters;
            document.getElementById('start-games').value = data.startGames;
            document.getElementById('total-games').value = data.totalGames;
            document.getElementById('machine-no').value = data.machineNo;
            document.getElementById('series-select').value = data.series || 'マイジャグラーV';
            
            if (!isInitializing) {
                isSubMode = false;
                isNameEditLocked = true;
                updateControlsUI();
            }
            
            renderCounters();
        }

        function recordHistory(effectiveG) {
            if (effectiveG <= 0) return;
            const history = appData[currentTab].history || [];
            
            const grapeCount = counters.find(c => c.name === 'ぶどう')?.count || 0;
            const regCount = (counters.find(c => c.name === '単独REG')?.count || 0) + (counters.find(c => c.name === 'チェリーREG')?.count || 0);
            const bbCount = (counters.find(c => c.name === '単独BIG')?.count || 0) + (counters.find(c => c.name === 'チェリーBIG')?.count || 0);
            const bonusCount = bbCount + regCount;

            const newPoint = {
                g: effectiveG,
                grape: grapeCount > 0 ? parseFloat((effectiveG / grapeCount).toFixed(2)) : null,
                reg: regCount > 0 ? parseFloat((effectiveG / regCount).toFixed(1)) : null,
                bonus: bonusCount > 0 ? parseFloat((effectiveG / bonusCount).toFixed(1)) : null
            };

            const lastPoint = history[history.length - 1];
            if (lastPoint && lastPoint.g === effectiveG) {
                history[history.length - 1] = newPoint;
            } else {
                history.push(newPoint);
            }
            appData[currentTab].history = history;
        }

        // --- 視覚的設定推測ゲージの作成 ---
        function createGaugeHTML(title, currentProb, specArray, color1, color2) {
            if (!currentProb || currentProb === Infinity) {
                return `<div style="margin-bottom:15px;">
                            <div style="font-size:13px; font-weight:bold;">${title}</div>
                            <div style="font-size:12px; color:var(--text-sub); margin-top:4px;">データ不足（カウント0回）</div>
                        </div>`;
            }
            
            let val1 = specArray[0];
            let val6 = specArray[5];
            
            // 設定1〜6の実際の差分から、現在地をパーセンテージで計算
            let percent = (val1 - currentProb) / (val1 - val6) * 100;
            let displayPercent = Math.max(-5, Math.min(105, percent)); // はみ出し過ぎを防止

            let html = `<div style="margin-bottom:30px;">
                <div style="display:flex; justify-content:space-between; font-size:13px; margin-bottom:12px;">
                    <strong>${title}</strong>
                    <span style="color:${color1}; font-weight:bold;">現在: 1/${currentProb.toFixed(2)}</span>
                </div>
                <div style="position:relative; width:100%; height:8px; background:var(--prob-bg); border-radius:4px;">
                    <!-- 現在値までのグラデーションバー -->
                    <div style="position:absolute; left:0; top:0; height:100%; width:${Math.max(0, Math.min(100, percent))}%; background:linear-gradient(90deg, ${color1} 0%, ${color2} 100%); border-radius:4px;"></div>
                    `;
            
            // 設定1〜6の目盛りを正確な比率で配置
            for (let i=0; i<6; i++) {
                let p = (val1 - specArray[i]) / (val1 - val6) * 100;
                html += `<div style="position:absolute; left:${p}%; top:-4px; width:2px; height:16px; background:var(--text-sub); border-radius:1px;"></div>`;
                html += `<div style="position:absolute; left:calc(${p}% - 4px); top:16px; font-size:10px; color:var(--text-sub); font-weight:bold;">${i+1}</div>`;
            }

            // 現在地を示すポインタ
            html += `<div style="position:absolute; left:calc(${displayPercent}% - 7px); top:-20px; font-size:16px; color:#ff3b30; text-shadow: 0 1px 2px rgba(0,0,0,0.2); z-index:2;">▼</div>
                </div>
            </div>`;
            return html;
        }

        function updateEstimation(effectiveG) {
            const series = document.getElementById('series-select').value;
            const spec = JUGGLER_SPECS[series];
            const resultBox = document.getElementById('estimation-result');

            if (!spec || effectiveG < 100) {
                resultBox.innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:12px; margin-bottom:10px;">100G以上実戦すると、ここに現在地を示すゲージが表示されます。</div>';
                return;
            }

            const grapeCount = counters.find(c => c.name === 'ぶどう')?.count || 0;
            const bbCount = (counters.find(c => c.name === '単独BIG')?.count || 0) + (counters.find(c => c.name === 'チェリーBIG')?.count || 0);
            const regCount = (counters.find(c => c.name === '単独REG')?.count || 0) + (counters.find(c => c.name === 'チェリーREG')?.count || 0);
            const bonusCount = bbCount + regCount;

            const currentGrapeProb = grapeCount > 0 ? effectiveG / grapeCount : Infinity;
            const currentBonusProb = bonusCount > 0 ? effectiveG / bonusCount : Infinity;

            let html = createGaugeHTML('🍇 ぶどう確率', currentGrapeProb, spec.grape, '#34c759', '#30d158');
            html += createGaugeHTML('🎰 ボーナス合算確率', currentBonusProb, spec.total, '#ff9500', '#ffcc00');

            resultBox.innerHTML = html;
        }

        // --- 機種スペック表の表示 ---
        function openSpecModal() {
            const series = document.getElementById('series-select').value;
            const spec = JUGGLER_SPECS[series];
            document.getElementById('spec-modal-title').innerText = `📖 ${series} スペック一覧`;
            
            const body = document.getElementById('spec-modal-body');
            if (!spec) {
                body.innerHTML = 'スペックデータがありません。';
            } else {
                let html = `<div class="table-responsive">
                    <table class="spec-table">
                    <tr><th>設定</th><th>ぶどう</th><th>単独BIG</th><th>合算BIG</th><th>単独REG</th><th>合算REG</th><th>合算ボーナス</th></tr>`;
                for (let i = 0; i < 6; i++) {
                    html += `<tr>
                        <td><strong>設定${i+1}</strong></td>
                        <td>1/${spec.grape[i].toFixed(2)}</td>
                        <td>1/${spec.solo_bb[i].toFixed(1)}</td>
                        <td>1/${spec.bb[i].toFixed(1)}</td>
                        <td>1/${spec.solo_rb[i].toFixed(1)}</td>
                        <td>1/${spec.rb[i].toFixed(1)}</td>
                        <td style="font-weight:bold; color:var(--mode-color);">1/${spec.total[i].toFixed(1)}</td>
                    </tr>`;
                }
                html += `</table></div>`;
                body.innerHTML = html;
            }
            document.getElementById('spec-modal').classList.add('active');
        }

        // --- 確率推移グラフの表示（100G以降限定） ---
        function openGraphModal() {
            document.getElementById('graph-modal').classList.add('active');
            const history = appData[currentTab].history || [];
            const filteredHistory = history.filter(h => h.g >= 100);
            
            const ctx = document.getElementById('probChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();

            if (filteredHistory.length === 0) {
                chartInstance = new Chart(ctx, {
                    type: 'line',
                    data: { labels: ['0G'], datasets: [] },
                    options: { plugins: { title: { display: true, text: '100G以降のデータからグラフ化されます' } } }
                });
                return;
            }

            const labels = filteredHistory.map(h => `${h.g}G`);
            const grapeData = filteredHistory.map(h => h.grape);
            const regData = filteredHistory.map(h => h.reg);

            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'ぶどう確率 (1/◯)', data: grapeData, borderColor: '#34c759', tension: 0.1, yAxisID: 'y' },
                        { label: 'REG確率 (1/◯)', data: regData, borderColor: '#007aff', tension: 0.1, yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { type: 'linear', position: 'left', title: { display: true, text: 'ぶどう' } },
                        y1: { type: 'linear', position: 'right', title: { display: true, text: 'REG' }, grid: { drawOnChartArea: false } }
                    }
                }
            });
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function copyData() {
            const series = document.getElementById('series-select').value;
            const machine = document.getElementById('machine-no').value || '未入力';
            const startG = document.getElementById('start-games').value;
            const totalG = document.getElementById('total-games').value;
            const effectiveG = (parseInt(totalG) || 0) - (parseInt(startG) || 0);

            let text = `【${series}】${machine}番台\n`;
            text += `開始: ${startG}G / 現在: ${totalG}G\n`;
            text += `個人総回転: ${effectiveG > 0 ? effectiveG : 0}G\n\n`;

            counters.forEach(c => {
                let prob = '1/---';
                if (c.count > 0 && effectiveG > 0) prob = '1/' + (effectiveG / c.count).toFixed(2);
                text += `${c.name}: ${c.count}回 (${prob})\n`;
            });

            navigator.clipboard.writeText(text).then(() => {
                alert('データをコピーしました！');
            }).catch(err => {
                alert('コピーに失敗しました。');
            });
        }

        function toggleTheme() {
            const body = document.body;
            const btn = document.querySelector('.theme-switch');
            body.classList.toggle('dark-mode');
            if (body.classList.contains('dark-mode')) {
                btn.innerText = '☀️ ライトモード';
            } else {
                btn.innerText = '🌙 ダークモード';
            }
            saveData();
        }

        function triggerFlash() {
            const body = document.body;
            body.classList.remove('flash-plus', 'flash-minus');
            void body.offsetWidth; 
            body.classList.add(isSubMode ? 'flash-minus' : 'flash-plus');
        }

        function updateControlsUI() {
            const modeBtn = document.getElementById('mode-btn');
            const btnTotal1 = document.getElementById('btn-total-1');
            const btnTotal10 = document.getElementById('btn-total-10');
            const lockBtn = document.getElementById('lock-btn');

            if (isSubMode) {
                document.body.classList.add('sub-mode');
                modeBtn.innerText = '【－】減算モード中';
                btnTotal1.innerText = '-1';
                btnTotal10.innerText = '-10';
            } else {
                document.body.classList.remove('sub-mode');
                modeBtn.innerText = '【＋】加算モード';
                btnTotal1.innerText = '+1';
                btnTotal10.innerText = '+10';
            }

            if (isNameEditLocked) {
                lockBtn.innerText = '名称変更: ロック中 🔒';
                lockBtn.classList.remove('unlocked');
            } else {
                lockBtn.innerText = '名称変更: 解除 🔓';
                lockBtn.classList.add('unlocked');
            }
        }

        function toggleMode() {
            isSubMode = !isSubMode;
            updateControlsUI();
        }

        function toggleLock() {
            isNameEditLocked = !isNameEditLocked;
            updateControlsUI();
            renderCounters();
        }

        function tapTotalGames(amount) {
            const input = document.getElementById('total-games');
            let current = parseInt(input.value) || 0;
            let delta = isSubMode ? -amount : amount;
            let newVal = current + delta;
            if (newVal < 0) newVal = 0;
            input.value = newVal;
            triggerFlash();
            renderCounters();
        }

        function tapCounter(id) {
            let target = counters.find(c => c.id === id);
            if (!target) return;
            if (isSubMode) {
                if (target.count > 0) target.count--;
            } else {
                target.count++;
            }
            triggerFlash();
            renderCounters();
        }

        function renameCounter(id, event) {
            if (isNameEditLocked) return;
            event.stopPropagation();
            let target = counters.find(c => c.id === id);
            let newName = prompt('新しい名称を入力してください', target.name);
            if (newName !== null && newName.trim() !== '') {
                target.name = newName.trim();
                renderCounters();
            }
        }

        function addCustomCounter() {
            let name = prompt('追加する項目の名前を入力してください');
            if (name !== null && name.trim() !== '') {
                counters.push({ id: Date.now(), name: name.trim(), count: 0 });
                renderCounters();
            }
        }

        function renderCounters() {
            const startG = parseInt(document.getElementById('start-games').value) || 0;
            const totalG = parseInt(document.getElementById('total-games').value) || 0;
            const effectiveG = totalG - startG;
            
            document.getElementById('effective-games-display').innerText = (effectiveG > 0 ? effectiveG : 0) + ' G';

            const container = document.getElementById('counters-container');
            container.innerHTML = '';
            
            counters.forEach(c => {
                let probText = '1/---';
                if (c.count > 0 && effectiveG > 0) {
                    probText = '1/' + (effectiveG / c.count).toFixed(2);
                }
                
                const div = document.createElement('div');
                div.className = 'counter-box';
                div.onclick = () => tapCounter(c.id);
                
                const nameClass = isNameEditLocked ? 'counter-name' : 'counter-name editable';
                const editIcon = isNameEditLocked ? '' : ' ✎';
                
                div.innerHTML = `
                    <div class="${nameClass}" onclick="renameCounter(${c.id}, event)">${c.name}${editIcon}</div>
                    <div class="counter-value">${c.count}</div>
                    <div class="counter-prob">${probText}</div>
                `;
                container.appendChild(div);
            });
            
            if (effectiveG > 0) {
                recordHistory(effectiveG);
                updateEstimation(effectiveG);
            }
            saveData(); 
        }

        function resetAll() {
            if (confirm(`現在開いている【台 ${currentTab}】のデータをすべて初期化しますか？`)) {
                appData[currentTab] = createDefaultData();
                counters = appData[currentTab].counters;
                
                document.getElementById('start-games').value = appData[currentTab].startGames;
                document.getElementById('total-games').value = appData[currentTab].totalGames;
                document.getElementById('machine-no').value = appData[currentTab].machineNo;
                document.getElementById('series-select').value = appData[currentTab].series;
                document.getElementById('estimation-result').innerHTML = '<div style="text-align:center; color:var(--text-sub); font-size:12px; margin-bottom:10px;">100G以上実戦すると、ここに現在地を示すゲージが表示されます。</div>';
                
                if(isSubMode) toggleMode(); 
                if(!isNameEditLocked) toggleLock(); 
                
                renderCounters();
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
