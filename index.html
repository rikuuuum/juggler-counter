<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#007aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="カウンター">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>高機能ジャグラーカウンター</title>
</head>
<body>
<header><h1>カウンター</h1><button class="icon" id="settings-open" aria-label="設定">⚙︎</button><button class="icon" id="theme-toggle">🌙</button></header>
<main>
  <nav class="tabs" aria-label="台切替"><button data-tab="A">台 A</button><button data-tab="B">台 B</button><button data-tab="C">台 C</button></nav>
  <label class="home-series">機種<select id="series-input"></select></label>
  <section class="quick-info"><span id="machine-number">台番号 未入力</span><span id="save-status">✓ 自動保存済み</span></section>
  <section id="start-card" class="start-card"><strong>この台の実戦を開始</strong><div><button id="start-zero">0Gから打つ</button><button id="start-mid">途中から打つ</button></div></section>
  <section id="snapshot-summary" class="snapshot-summary" hidden><span id="snapshot-text"></span><button id="snapshot-edit">修正</button></section>
  <button id="delete-data" class="danger home-danger">この台のデータを削除</button>
  <section class="mode-switch"><button data-mode="machine">台全体 0G〜</button><button data-mode="session">自分の実戦</button></section>
  <section class="game-card">
    <div><small>総回転 <button class="mini-edit" id="total-edit" aria-label="総回転を修正">✎</button></small><button class="game-value" id="total-display" aria-label="総回転を編集">0 G</button></div>
    <div class="game-controls"><button data-games="-10">−10</button><button data-games="-1">−1</button><button data-games="1">+1</button><button data-games="10">+10</button></div>
  </section>
  <p class="counter-note" id="counter-note">着席前の内訳が不明なため各カウント確率は「—」で表示します。</p>
  <section id="counter-grid" class="counter-grid" aria-label="基本カウントカード"></section>
  <details id="custom-section" class="custom-section" hidden><summary id="custom-summary">追加項目</summary><section id="custom-grid" class="counter-grid custom-grid" aria-label="追加カウントカード"></section></details>
  <section class="count-controls"><button id="add-mode" class="active">＋ 加算</button><button id="subtract-mode">－ 減算</button><button class="undo" id="undo-button">↶ 1つ戻す</button></section>
  <section class="aggregate"><div><small>BIG合算</small><strong id="agg-bb">1/---</strong></div><div><small>REG合算</small><strong id="agg-rb">1/---</strong></div><div><small>ボーナス合算</small><strong id="agg-total">1/---</strong></div></section>
  <details class="main-compare" open><summary>設定別基準値との比較</summary><div id="main-compare-content"></div></details>
  <section class="actions"><button data-open="spec">スペック</button></section>
</main>
<footer class="affiliate">PR / 関連コンテンツ<br><small>当サイトはアフィリエイト広告を利用しています。</small></footer>

<dialog id="settings-dialog"><form method="dialog" class="dialog-card"><header><h2>台設定・カウンター編集</h2><button>✕</button></header>
  <label>台番号<input id="machine-input" maxlength="30"></label>
  <label>現在の総回転<input id="total-input" type="number" min="0" inputmode="numeric"></label><small>入力中は履歴に保存せず、変更確定時に記録します。</small>
  <section id="counter-settings"></section><button type="button" id="add-counter">＋ カスタム項目を追加</button>
</form></dialog>

<dialog id="snapshot-dialog"><form method="dialog" class="dialog-card"><header><h2>着席時データ</h2><button>✕</button></header><label>総回転<input id="start-total-input" type="number" min="0" inputmode="numeric"></label><label>BIG<input id="start-bb-input" type="number" min="0" inputmode="numeric"></label><label>REG<input id="start-rb-input" type="number" min="0" inputmode="numeric"></label><button type="button" id="snapshot-save">実戦開始 / 保存</button></form></dialog>
<dialog id="count-dialog"><form method="dialog" class="dialog-card"><header><h2 id="count-dialog-title">回数を編集</h2><button>✕</button></header><label>回数<input id="count-edit-input" type="number" min="0" step="1" inputmode="numeric"></label><p id="count-edit-error" class="error" hidden>0以上の整数を入力してください。</p><div class="settings-actions"><button value="cancel">キャンセル</button><button type="button" id="count-edit-save">保存</button></div></form></dialog>
<dialog id="total-dialog"><form method="dialog" class="dialog-card"><header><h2>総回転を修正</h2><button>✕</button></header><label>総回転<input id="total-edit-input" type="number" min="0" step="1" inputmode="numeric"></label><p id="total-edit-error" class="error" hidden>着席時総回転以上の整数を入力してください。</p><div class="settings-actions"><button value="cancel">キャンセル</button><button type="button" id="total-edit-save">保存</button></div></form></dialog>

<dialog id="spec-dialog"><form method="dialog" class="dialog-card"><header><h2 id="spec-title">機種スペック</h2><button>✕</button></header><div class="table-wrap" id="spec-content"></div></form></dialog>
<script src="./app.js"></script>
<div id="tap-flash" aria-hidden="true"><span id="tap-status" role="status" aria-live="polite"></span></div>
</body></html>
