
name: Sync ChatGPT release to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-chatgpt-release.yml']
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: juggler-release-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'rikuuuum/juggler-counter'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Get release from published Google Doc
        run: |
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            'https://docs.google.com/document/d/1dTc4bPWEeJO0127C64gey4X0DTYZKF062HwCHQ9DPvE/export?format=txt' \
            --output "$RUNNER_TEMP/release.json"

      - name: Validate and apply release
        id: apply
        env:
          RELEASE_FILE: ${{ runner.temp }}/release.json
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, sys
          from pathlib import Path

          # Only app files can be updated.
          allowed = {
              'index.html', 'app.js', 'styles.css',
              'sw.js', 'manifest.webmanifest',
              'data/juggler-specs.json', 'icons/icon.svg'
          }
          release = json.loads(
              Path(os.environ['RELEASE_FILE'])
              .read_text(encoding='utf-8-sig').strip()
          )
          if release.get('schema') != 1 or release.get('repo') != 'rikuuuum/juggler-counter':
              sys.exit('Wrong release schema or repository')

          items = release.get('files')
          if not isinstance(items, dict) or not items or not set(items) <= allowed:
              sys.exit('Release includes unexpected files')

          changes = {}
          for name, entry in items.items():
              path = Path(name)
              if not path.is_file() or path.is_symlink() or not isinstance(entry, dict):
                  sys.exit('Invalid path: ' + name)
              if not isinstance(entry.get('content_base64'), str):
                  sys.exit('Missing release contents: ' + name)

              try:
                  data = base64.b64decode(
                      entry['content_base64'], validate=True
                  )
                  data.decode('utf-8')
              except (ValueError, UnicodeDecodeError) as e:
                  sys.exit('Invalid UTF-8 or base64 for ' + name + ': ' + str(e))

              if len(data) > 2_000_000:
                  sys.exit('File too large: ' + name)

              old = path.read_bytes()
              if old != data:
                  actual_sha = subprocess.check_output(
                      ['git', 'hash-object', '--', name], text=True
                  ).strip()
                  if actual_sha != entry.get('base_git_blob_sha'):
                      sys.exit('Unexpected upstream changes to ' + name)
                  changes[name] = data

          if 'data/juggler-specs.json' in items:
              before = json.loads(
                  Path('data/juggler-specs.json').read_bytes()
              )
              after = json.loads(base64.b64decode(
                  items['data/juggler-specs.json']['content_base64']
              ))
              if not isinstance(after, list) or len({s['name'] for s in after}) != len(after):
                  sys.exit('Invalid machine lineup')

              if release.get('release') == 'add-my-juggler-vi-20261107':
                  vi = [s for s in after if s['name'] == 'マイジャグラーVI']
                  if len(after) != 8 or len(vi) != 1:
                      sys.exit('Expected 8 models including My Juggler VI')

                  original = [
                      s for s in before if s['name'] != 'マイジャグラーVI'
                  ]
                  retained = [
                      s for s in after if s['name'] != 'マイジャグラーVI'
                  ]
                  if original != retained:
                      sys.exit('Existing seven models were modified')

                  expected_values = {
                      'bb': [273.1,270.8,266.4,254,240.1,229.1],
                      'rb': [409.6,385.5,336.1,290,268.6,229.1],
                      'total': [163.8,159.1,148.6,135.4,126.8,114.6]
                  }
                  for key, expected in expected_values.items():
                      if vi[0].get(key) != expected:
                          sys.exit('My Juggler VI data mismatch: ' + key)

          if 'app.js' in items:
              app = base64.b64decode(
                  items['app.js']['content_base64']
              ).decode('utf-8')
              if "const KEY='jugglerMultiData_v9', V=9;" not in app:
                  sys.exit('Persistence format changed')

          if release.get('release') == 'add-my-juggler-vi-20261107' and 'sw.js' in items:
              sw = base64.b64decode(
                  items['sw.js']['content_base64']
              )
              if b'juggler-counter-v14' not in sw:
                  sys.exit('Cache version was not updated')

          for name, data in changes.items():
              Path(name).write_bytes(data)

          subprocess.run(['node', '--check', 'app.js'], check=True)
          subprocess.run(['git', 'diff', '--check'], check=True)

          if changes:
              subprocess.run(
                  ['git', 'add', '--', *changes], check=True
              )

          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(
                  'changed=' + ('true' if changes else 'false') + '\n'
              )

          print('Validated release:', release.get('release'))
          print('Changed:', list(changes))
          PY

      - name: Save tested files to main
        if: steps.apply.outputs.changed == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply validated ChatGPT juggler release'
          git push origin HEAD:main

      - name: Request build of existing GitHub Pages site
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --location --silent --show-error \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
